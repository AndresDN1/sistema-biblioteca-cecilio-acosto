[tool.ruff]
target-version = "py310"
line-length = 88
preview = true
output-format = "grouped"

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "instance",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "B",
    "UP",
    "S",
    "SIM",
    "C4",
    "T20",
    "FURB",
]

ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

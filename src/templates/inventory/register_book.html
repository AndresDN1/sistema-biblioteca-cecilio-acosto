{% extends "base.html" %}

{% block title %}Registrar Libro - Sistema Bibliotecario{% endblock %}

{% block content %}
<div class="container margin-top-lg">
    <div class="card">
        <h2>Registrar Nuevo Libro</h2>

        <div id="form-feedback" class="alert hidden margin-top-sm" role="alert"></div>

        <form id="register-book-form" class="margin-top-md">
            <div class="form-group">
                <label for="title">Título *</label>
                <input type="text" id="title" name="title" class="form-control" required />
            </div>

            <div class="form-group margin-top-sm">
                <label for="author">Autor *</label>
                <input type="text" id="author" name="author" class="form-control" required />
            </div>

            <div class="form-group margin-top-sm">
                <label for="publisher">Editorial *</label>
                <input type="text" id="publisher" name="publisher" class="form-control" required />
            </div>

            <div class="form-group margin-top-sm">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" class="form-control" />
            </div>

            <div class="form-group margin-top-sm">
                <label for="publication_year">Año de Publicación</label>
                <input type="number" id="publication_year" name="publication_year" class="form-control" placeholder="Ej: 2024" />
            </div>

            <div class="form-group margin-top-sm">
                <label for="dewey_code">Código Dewey</label>
                <input type="text" id="dewey_code" name="dewey_code" class="form-control" />
            </div>

            <div class="form-group margin-top-sm">
                <label for="collection_id">ID de Colección</label>
                <input type="number" id="collection_id" name="collection_id" class="form-control" value="1" />
            </div>

            <div class="form-checkbox-group margin-top-md">
                <label>
                    <input type="checkbox" id="is_braille" name="is_braille" />
                    Es edición Braille
                </label>
                <label>
                    <input type="checkbox" id="is_audiobook" name="is_audiobook" />
                    Es Audiolibro
                </label>
            </div>

            <div class="margin-top-md">
                <button type="submit" id="btn-submit-book" class="btn btn-primary">Registrar Libro</button>
                <a href="{{ url_for('inventory.search_view') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/pages/register_book.js') }}"></script>
{% endblock %}

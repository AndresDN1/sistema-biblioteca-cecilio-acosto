{% extends 'base.html' %}

{% block title %}Crear Cuenta - Biblioteca Cecilio Acosta{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="color: var(--primary-red); margin-bottom: 2rem; text-align: center;">Crear Cuenta</h2>

    <form id="registerForm">
        <div class="form-group">
            <label for="full_name">Nombre Completo</label>
            <input type="text" id="full_name" name="full_name" required placeholder="Ej: Juan Pérez">
        </div>

        <div class="form-group">
            <label for="username">Nombre de Usuario</label>
            <input type="text" id="username" name="username" minlength="3" required placeholder="mínimo 3 caracteres">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" minlength="6" required placeholder="mínimo 6 caracteres">
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Registrarse</button>
    </form>

    <p style="text-align: center; font-size: 0.95rem; margin-top: 2rem; color: var(--text-muted);">
        ¿Ya posees una cuenta? <a href="{{ url_for('core.login_view') }}"
            style="color: var(--primary-red); font-weight: bold; text-decoration: none;">Inicia sesión</a>
    </p>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/pages/auth.js') }}"></script>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Biblioteca Cecilio Acosta{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="color: var(--primary-red); margin-bottom: 2rem; text-align: center;">Iniciar Sesión</h2>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required autocomplete="username" placeholder="Nombre de usuario">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Ingresar al Sistema</button>
    </form>

    <p style="text-align: center; font-size: 0.95rem; margin-top: 2rem; color: var(--text-muted);">
        ¿No tienes una cuenta? <a href="{{ url_for('core.register_view') }}"
            style="color: var(--primary-red); font-weight: bold; text-decoration: none;">Regístrate aquí</a>
    </p>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/pages/auth.js') }}"></script>
{% endblock %}
